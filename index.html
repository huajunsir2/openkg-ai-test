<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D 贪食蛇 · Snake 3D</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <span class="logo">🐍</span>
          <h1>3D 贪食蛇</h1>
        </div>
        <div class="stats">
          <div class="stat">
            <span class="stat-label">分数</span>
            <span id="score" class="stat-value">0</span>
          </div>
          <div class="stat">
            <span class="stat-label">最高分</span>
            <span id="best" class="stat-value">0</span>
          </div>
          <div class="stat">
            <span class="stat-label">长度</span>
            <span id="length" class="stat-value">3</span>
          </div>
          <div class="stat">
            <span class="stat-label">速度</span>
            <span id="speed" class="stat-value">1.0x</span>
          </div>
        </div>
      </header>

      <main class="stage">
        <canvas id="game"></canvas>

        <aside class="sidebar">
          <section class="card">
            <h2>蛇头头像</h2>
            <p class="hint">上传一张图片作为蛇头贴图（推荐正方形人脸照片）。</p>
            <div class="avatar-row">
              <div class="avatar-preview">
                <img id="avatar-img" alt="蛇头头像预览" />
              </div>
              <div class="avatar-actions">
                <label class="btn primary">
                  上传头像
                  <input id="avatar-input" type="file" accept="image/*" hidden />
                </label>
                <button id="avatar-reset" class="btn ghost">恢复默认</button>
              </div>
            </div>
          </section>

          <section class="card">
            <h2>操作</h2>
            <ul class="keys">
              <li><kbd>W</kbd>/<kbd>↑</kbd> 前进</li>
              <li><kbd>S</kbd>/<kbd>↓</kbd> 后退</li>
              <li><kbd>A</kbd>/<kbd>←</kbd> 左转</li>
              <li><kbd>D</kbd>/<kbd>→</kbd> 右转</li>
              <li><kbd>Space</kbd> 暂停 / 继续</li>
              <li><kbd>R</kbd> 重新开始</li>
            </ul>
          </section>

          <section class="card">
            <h2>设置</h2>
            <label class="row">
              <span>速度</span>
              <input id="speed-range" type="range" min="3" max="14" step="0.5" value="6" />
            </label>
            <label class="row">
              <span>网格大小</span>
              <select id="grid-size">
                <option value="15">15 × 15</option>
                <option value="20" selected>20 × 20</option>
                <option value="25">25 × 25</option>
                <option value="30">30 × 30</option>
              </select>
            </label>
            <label class="row checkbox">
              <input id="wrap" type="checkbox" />
              <span>穿墙模式</span>
            </label>
            <button id="restart" class="btn primary block">重新开始</button>
          </section>
        </aside>

        <div id="overlay" class="overlay hidden">
          <div class="overlay-card">
            <h2 id="overlay-title">游戏结束</h2>
            <p id="overlay-text">本局得分 0</p>
            <button id="overlay-btn" class="btn primary">再来一局</button>
          </div>
        </div>
      </main>

      <footer class="footer">
        <span>用 Three.js 打造 · 提示：可上传自己喜欢的头像作为蛇头</span>
      </footer>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
      }
    </script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
